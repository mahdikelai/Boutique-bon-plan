<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - Boutique Bon Plan</title>
    <style>
        :root { --pink: #e6007e; --pink-soft: #fdeef3; --gold: #d4af37; --black: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-text-size-adjust: 100%; }
        body { background: #fff; color: var(--black); padding-bottom: 40px; }
        .header { background: linear-gradient(90deg, var(--pink), var(--gold)); color: white; padding: 16px; text-align: center; }
        .header h1 { font-size: 18px; font-weight: 800; }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .step { background: var(--pink-soft); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
        .step h3 { color: var(--pink); font-size: 14px; margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px; }
        input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #eee; font-size: 14px; background: white; }
        textarea { resize: vertical; min-height: 50px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .img-preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        .img-preview-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; border: 2px solid var(--pink); }
        .file-btn { display: block; text-align: center; background: white; border: 2px dashed var(--pink); color: var(--pink); padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, var(--pink), var(--gold)); color: white; border: none; padding: 16px; border-radius: 40px; font-size: 16px; font-weight: 800; margin-top: 16px; cursor: pointer; }
        .success-msg { display: none; background: #d1fae5; color: #065f46; padding: 12px; border-radius: 10px; text-align: center; font-weight: 700; margin-top: 14px; }
        .success-msg.show { display: block; }
        .back-link { display: inline-block; margin: 12px 16px; color: var(--pink); text-decoration: none; font-weight: 700; }
        .products-list { margin-top: 20px; }
        .products-list h3 { color: var(--pink); margin-bottom: 10px; }
        .prod-item { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid var(--pink-soft); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
        .prod-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        .prod-item .info { flex: 1; font-size: 13px; }
        .prod-item .info b { display: block; }
        .prod-item button { background: #fee2e2; color: #dc2626; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
        .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .tab-btn { flex: 1 1 30%; min-width: 90px; padding: 10px 6px; border-radius: 10px; border: none; background: var(--pink-soft); color: var(--black); font-weight: 700; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: var(--pink); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
    <script src="apply-colors.js"></script>
</head>
<body>
    <div class="header">
        <h1>🛠️ لوحة تحكم المتجر</h1>
    </div>
    <a href="index.html" class="back-link">→ رجوع للموقع</a>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('add')">➕ إضافة منتج</button>
            <button class="tab-btn" onclick="showTab('manage')">📦 المنتجات المزادة</button>
            <button class="tab-btn" onclick="showTab('delivery')">🚚 أسعار التوصيل</button>
            <button class="tab-btn" onclick="showTab('categories')">📂 الأقسام</button>
            <button class="tab-btn" onclick="showTab('banners')">🖼️ البانرات</button>
            <button class="tab-btn" onclick="showTab('colors')">🎨 الألوان</button>
        </div>

        <div class="tab-content active" id="tab-add">
            <div class="step">
                <h3>1️⃣ معلومات المنتج</h3>
                <label>اسم المنتج</label>
                <input type="text" id="pname" placeholder="مثلا: فستان صيفي وردي" />

                <div class="row2">
                    <div>
                        <label>السعر (دج)</label>
                        <input type="number" id="pprice" placeholder="1500" />
                    </div>
                    <div>
                        <label>المخزون (اختياري، اتركيه فارغ إذا الكمية عادية)</label>
                        <input type="number" id="pstock" placeholder="مثلا: 3" />
                    </div>
                    <div>
                        <label>القسم</label>
                        <select id="pcat">
                            <option value="lingerie">👙 ملابس داخلية نسائية</option>
                            <option value="ensembles">🎀 أطقم نسائية</option>
                            <option value="bodysuits">✨ بودي نسائي</option>
                            <option value="robes">👗 فساتين وملابس نسائية</option>
                            <option value="sleepwear">🌙 ملابس النوم</option>
                            <option value="bridal">👰🏻‍♀️ تشكيلة العروس</option>
                            <option value="shapewear">💎 ملابس شدّ الجسم</option>
                            <option value="promotions">🔥 العروض والتخفيضات</option>
                            <option value="packs">🎁 عروض الباك</option>
                        </select>
                    </div>
                </div>

                <div class="row2">
                    <div>
                        <label>اللون</label>
                        <input type="text" id="pcolor" placeholder="مثلا: وردي" />
                    </div>
                    <div>
                        <label>الستايل</label>
                        <input type="text" id="pstyle" placeholder="مثلا: أنيق" />
                    </div>
                </div>

                <label>وصف قصير (اختياري)</label>
                <textarea id="pdesc" placeholder="👗 أناقة وتميّز..."></textarea>
            </div>

            <div class="step">
                <h3>2️⃣ صور المنتج</h3>
                <label class="file-btn" for="fileInput">📷 اختاري صور من المعرض (يمكن أكثر من وحدة)</label>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(event)" />
                <div class="img-preview-grid" id="previewGrid"></div>
            </div>

            <button class="submit-btn" onclick="saveProduct()">✅ حفظ المنتج فالموقع</button>
            <div class="success-msg" id="successMsg">✅ تمت إضافة المنتج بنجاح! رجعي للموقع باش تشوفيه</div>
        </div>

        <div class="tab-content" id="tab-manage">
            <div class="products-list" id="productsList"></div>
        </div>

        <div class="tab-content" id="tab-delivery">
            <h3 style="margin-bottom:10px;">➕ إضافة ولاية/منطقة جديدة</h3>
            <input type="text" id="newWilayaName" placeholder="مثلا: 59 - منطقة جديدة" style="width:100%; margin-bottom:6px; padding:8px; border-radius:8px; border:1px solid #ddd;" />
            <div style="display:flex; gap:6px; margin-bottom:6px;">
                <input type="number" id="newWilayaOffice" placeholder="سعر المكتب" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd;" />
                <input type="number" id="newWilayaHome" placeholder="سعر المنزل" style="flex:1; padding:8px; border-radius:8px; border:1px solid #ddd;" />
            </div>
            <button onclick="addWilaya()" style="width:100%; padding:10px; background:#e6007e; color:white; border:none; border-radius:8px; font-weight:700; margin-bottom:16px;">➕ إضافة</button>

            <h3 style="margin-bottom:10px;">🚚 تعديل أسعار الولايات</h3>
            <input type="text" id="wilayaSearch" placeholder="🔍 ابحثي عن ولاية..." oninput="filterWilayaList()" style="width:100%; margin-bottom:10px; padding:8px; border-radius:8px; border:1px solid #ddd;" />
            <div id="deliveryList"></div>
        </div>

        <div class="tab-content" id="tab-categories">
            <h3 style="margin-bottom:10px;">➕ إضافة / تعديل قسم</h3>
            <input type="text" id="catId" placeholder="معرف القسم (بالإنجليزية بلا مسافات، مثلا: shoes)" style="width:100%; margin-bottom:6px; padding:8px; border-radius:8px; border:1px solid #ddd;" />
            <input type="text" id="catLabel" placeholder="الاسم الظاهر (مثلا: 👠 أحذية نسائية)" style="width:100%; margin-bottom:6px; padding:8px; border-radius:8px; border:1px solid #ddd;" />
            <input type="file" id="catImageInput" accept="image/*" style="width:100%; margin-bottom:6px;" />
            <button onclick="saveCategory()" style="width:100%; padding:10px; background:#e6007e; color:white; border:none; border-radius:8px; font-weight:700; margin-bottom:16px;">💾 حفظ القسم</button>

            <h3 style="margin-bottom:10px;">📂 الأقسام الحالية</h3>
            <div id="categoriesList"></div>
        </div>

        <div class="tab-content" id="tab-banners">
            <h3 style="margin-bottom:10px;">➕ إضافة بانر جديد</h3>
            <input type="file" id="bannerImageInput" accept="image/*" style="width:100%; margin-bottom:6px;" />
            <input type="text" id="bannerLink" placeholder="الرابط عند الضغط (اختياري، مثلا: category.html?cat=robes)" style="width:100%; margin-bottom:6px; padding:8px; border-radius:8px; border:1px solid #ddd;" />
            <input type="text" id="bannerCaption" placeholder="نص فوق الصورة (اختياري)" style="width:100%; margin-bottom:6px; padding:8px; border-radius:8px; border:1px solid #ddd;" />
            <button onclick="addBanner()" style="width:100%; padding:10px; background:#e6007e; color:white; border:none; border-radius:8px; font-weight:700; margin-bottom:16px;">➕ إضافة البانر</button>

            <h3 style="margin-bottom:10px;">🖼️ البانرات الحالية</h3>
            <div id="bannersList"></div>
        </div>

        <div class="tab-content" id="tab-colors">
            <h3 style="margin-bottom:10px;">🎨 ألوان الموقع</h3>
            <div id="colorsForm"></div>
            <button onclick="saveColors()" style="width:100%; padding:10px; background:#e6007e; color:white; border:none; border-radius:8px; font-weight:700; margin-top:10px;">💾 حفظ ونشر الألوان</button>
        </div>
    </div>

    <script>
        let selectedImages = [];

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
            if (tab === 'manage') renderProductsList();
            if (tab === 'delivery') renderDeliveryList();
            if (tab === 'categories') renderCategoriesList();
            if (tab === 'banners') renderBannersList();
            if (tab === 'colors') renderColorsForm();
        }

        const colorLabels = {
            '--pink': 'اللون الوردي الأساسي',
            '--pink-soft': 'الوردي الفاتح',
            '--gold': 'اللون الذهبي',
            '--black': 'اللون الأسود',
            '--bg': 'خلفية الموقع',
            '--wa-green': 'أخضر واتساب'
        };

        function renderColorsForm() {
            const form = document.getElementById('colorsForm');
            form.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">⏳ جاري التحميل...</p>';
            fetch('http://localhost:5000/get-colors')
                .then(res => res.json())
                .then(colors => {
                    form.innerHTML = '';
                    Object.keys(colors).forEach(key => {
                        const row = document.createElement('div');
                        row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eee;';
                        row.innerHTML = `
                            <input type="color" value="${colors[key]}" id="color-${key}" style="width:44px; height:34px; border:none; border-radius:6px;" />
                            <div style="flex:1; font-size:13px;">${colorLabels[key] || key}</div>
                        `;
                        form.appendChild(row);
                    });
                })
                .catch(() => {
                    form.innerHTML = '<p style="text-align:center; color:red; padding:20px;">❌ السيرفر غير متصل</p>';
                });
        }

        function saveColors() {
            const colors = {};
            Object.keys(colorLabels).forEach(key => {
                const input = document.getElementById('color-' + key);
                if (input) colors[key] = input.value;
            });

            fetch('http://localhost:5000/save-colors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(colors)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم حفظ الألوان ونشرها');
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }

        function renderBannersList() {
            const list = document.getElementById('bannersList');
            list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">⏳ جاري التحميل...</p>';
            fetch('http://localhost:5000/get-banners')
                .then(res => res.json())
                .then(banners => {
                    if (!banners.length) {
                        list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">مافيش بانرات حتى الآن</p>';
                        return;
                    }
                    list.innerHTML = '';
                    banners.forEach(b => {
                        const item = document.createElement('div');
                        item.style.cssText = 'display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eee;';
                        const preview = b.image
                            ? `<img src="${b.image}" style="width:60px; height:35px; object-fit:cover; border-radius:6px;" />`
                            : `<div style="width:60px; height:35px; border-radius:6px; background:linear-gradient(135deg,#e6007e,#d4af37);"></div>`;
                        item.innerHTML = `
                            ${preview}
                            <div style="flex:1; font-size:12px;">${b.caption || '(بلا نص)'}<br><small style="color:#999;">${b.link || 'بلا رابط'}</small></div>
                            <button onclick="deleteBanner('${b.id}')" style="padding:6px 10px; background:#999; color:white; border:none; border-radius:6px;">🗑️</button>
                        `;
                        list.appendChild(item);
                    });
                })
                .catch(() => {
                    list.innerHTML = '<p style="text-align:center; color:red; padding:20px;">❌ السيرفر غير متصل</p>';
                });
        }

        function addBanner() {
            const fileInput = document.getElementById('bannerImageInput');
            const link = document.getElementById('bannerLink').value.trim();
            const caption = document.getElementById('bannerCaption').value.trim();

            if (fileInput.files.length === 0) {
                alert('عمري، خاصك تختاري صورة للبانر');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                fetch('http://localhost:5000/save-banner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: e.target.result, link: link, caption: caption })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('✅ تم إضافة البانر ونشره');
                        fileInput.value = '';
                        document.getElementById('bannerLink').value = '';
                        document.getElementById('bannerCaption').value = '';
                        renderBannersList();
                    } else {
                        alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                    }
                })
                .catch(() => alert('❌ السيرفر غير متصل'));
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function deleteBanner(id) {
            if (!confirm('متأكدة تحبي تحذفي هذا البانر؟')) return;
            fetch('http://localhost:5000/delete-banner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم الحذف ونشره');
                    renderBannersList();
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }

        function renderCategoriesList() {
            const list = document.getElementById('categoriesList');
            list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">⏳ جاري التحميل...</p>';
            fetch('http://localhost:5000/get-categories')
                .then(res => res.json())
                .then(cats => {
                    if (!cats.length) {
                        list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">مافيش أقسام حتى الآن</p>';
                        return;
                    }
                    list.innerHTML = '';
                    cats.forEach(c => {
                        const item = document.createElement('div');
                        item.style.cssText = 'display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eee;';
                        item.innerHTML = `
                            <img src="${c.image}" style="width:50px; height:50px; object-fit:cover; border-radius:8px;" />
                            <div style="flex:1;"><b>${c.label}</b><br><small style="color:#999;">${c.id}</small></div>
                            <button onclick="editCategory('${c.id}','${c.label}')" style="padding:6px 10px; background:#e6007e; color:white; border:none; border-radius:6px;">✏️</button>
                            <button onclick="deleteCategory('${c.id}')" style="padding:6px 10px; background:#999; color:white; border:none; border-radius:6px;">🗑️</button>
                        `;
                        list.appendChild(item);
                    });
                })
                .catch(() => {
                    list.innerHTML = '<p style="text-align:center; color:red; padding:20px;">❌ السيرفر غير متصل</p>';
                });
        }

        function editCategory(id, label) {
            document.getElementById('catId').value = id;
            document.getElementById('catLabel').value = label;
        }

        function saveCategory() {
            const id = document.getElementById('catId').value.trim();
            const label = document.getElementById('catLabel').value.trim();
            const fileInput = document.getElementById('catImageInput');

            if (!id || !label) {
                alert('عمري، خاصك تعبي المعرف والاسم');
                return;
            }

            function sendData(imageB64) {
                fetch('http://localhost:5000/save-category', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, label: label, image: imageB64 })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('✅ تم حفظ القسم ونشره');
                        document.getElementById('catId').value = '';
                        document.getElementById('catLabel').value = '';
                        fileInput.value = '';
                        renderCategoriesList();
                    } else {
                        alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                    }
                })
                .catch(() => alert('❌ السيرفر غير متصل'));
            }

            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) { sendData(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                sendData(null);
            }
        }

        function deleteCategory(id) {
            if (!confirm('متأكدة تحبي تحذفي هذا القسم؟')) return;
            fetch('http://localhost:5000/delete-category', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم الحذف ونشره');
                    renderCategoriesList();
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }

        let allWilayas = [];

        function renderDeliveryList() {
            const list = document.getElementById('deliveryList');
            list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">⏳ جاري التحميل...</p>';
            fetch('http://localhost:5000/get-delivery-prices')
                .then(res => res.json())
                .then(wilayas => {
                    allWilayas = wilayas;
                    drawWilayaList(wilayas);
                })
                .catch(() => {
                    list.innerHTML = '<p style="text-align:center; color:red; padding:20px;">❌ السيرفر غير متصل</p>';
                });
        }

        function drawWilayaList(wilayas) {
            const list = document.getElementById('deliveryList');
            list.innerHTML = '';
            wilayas.forEach(w => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; align-items:center; gap:6px; padding:8px 0; border-bottom:1px solid #eee;';
                row.innerHTML = `
                    <div style="flex:2; font-weight:600; font-size:13px;">${w.name}</div>
                    <input type="text" value="${w.office}" style="flex:1; width:60px; padding:6px; border-radius:6px; border:1px solid #ddd; text-align:center;" id="office-${w.name}" />
                    <input type="text" value="${w.home}" style="flex:1; width:60px; padding:6px; border-radius:6px; border:1px solid #ddd; text-align:center;" id="home-${w.name}" />
                    <button onclick="saveWilayaPrice('${w.name}')" style="padding:6px 10px; background:#e6007e; color:white; border:none; border-radius:6px;">💾</button>
                    <button onclick="deleteWilaya('${w.name}')" style="padding:6px 10px; background:#999; color:white; border:none; border-radius:6px;">🗑️</button>
                `;
                list.appendChild(row);
            });
        }

        function filterWilayaList() {
            const query = document.getElementById('wilayaSearch').value.trim();
            const filtered = allWilayas.filter(w => w.name.includes(query));
            drawWilayaList(filtered);
        }

        function saveWilayaPrice(name) {
            const officeVal = document.getElementById('office-' + name).value.trim();
            const homeVal = document.getElementById('home-' + name).value.trim();
            const office = officeVal === '-' ? '-' : parseInt(officeVal);
            const home = homeVal === '-' ? '-' : parseInt(homeVal);

            fetch('http://localhost:5000/update-delivery-price', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, office: office, home: home })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم تحديث سعر ' + name + ' ونشره');
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }

        function deleteWilaya(name) {
            if (!confirm('متأكدة تحبي تحذفي ' + name + '؟')) return;
            fetch('http://localhost:5000/delete-delivery-price', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم الحذف ونشره');
                    renderDeliveryList();
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }

        function addWilaya() {
            const name = document.getElementById('newWilayaName').value.trim();
            const office = parseInt(document.getElementById('newWilayaOffice').value) || 0;
            const home = parseInt(document.getElementById('newWilayaHome').value) || 0;

            if (!name) {
                alert('عمري، خاصك تكتبي اسم الولاية أو المنطقة');
                return;
            }

            fetch('http://localhost:5000/update-delivery-price', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, office: office, home: home, isNew: true })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم إضافة ' + name + ' ونشره');
                    document.getElementById('newWilayaName').value = '';
                    document.getElementById('newWilayaOffice').value = '';
                    document.getElementById('newWilayaHome').value = '';
                    renderDeliveryList();
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }

        function handleFiles(event) {
            const files = Array.from(event.target.files);
            selectedImages = [];
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImages.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function saveProduct() {
            const name = document.getElementById('pname').value.trim();
            const price = document.getElementById('pprice').value.trim();
            const cat = document.getElementById('pcat').value;
            const color = document.getElementById('pcolor').value.trim();
            const style = document.getElementById('pstyle').value.trim();
            const desc = document.getElementById('pdesc').value.trim();
            const stock = document.getElementById('pstock').value.trim();

            if (!name || !price || selectedImages.length === 0) {
                alert('عمري، خاصك تعبي على الأقل: الاسم، السعر، وصورة وحدة');
                return;
            }

            const product = {
                id: Date.now(),
                category: cat,
                brand: 'Boutique Bon Plan',
                name: name,
                price: parseInt(price),
                images: selectedImages,
                rating: 4.8,
                color: color,
                style: style
            };
            if (desc) product.description = desc;
            if (stock) product.stock = parseInt(stock);

            document.getElementById('successMsg').innerHTML = '⏳ جاري النشر...';
            document.getElementById('successMsg').classList.add('show');

            fetch('http://localhost:5000/add-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('successMsg').innerHTML = '✅ تم إضافة المنتج ونشره بنجاح!';
                } else {
                    document.getElementById('successMsg').innerHTML = '❌ خطأ: ' + (data.error || 'مشكل غير معروف');
                }
            })
            .catch(err => {
                document.getElementById('successMsg').innerHTML = '❌ السيرفر غير متصل. تأكدي أنه خدام.';
            });
            document.getElementById('pname').value = '';
            document.getElementById('pprice').value = '';
            document.getElementById('pcolor').value = '';
            document.getElementById('pstyle').value = '';
            document.getElementById('pdesc').value = '';
            document.getElementById('previewGrid').innerHTML = '';
            document.getElementById('fileInput').value = '';
            selectedImages = [];

            setTimeout(() => document.getElementById('successMsg').classList.remove('show'), 4000);
        }

        let allCategoriesForDropdown = [];

        function renderProductsList() {
            const list = document.getElementById('productsList');
            list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">⏳ جاري التحميل...</p>';

            Promise.all([
                fetch('http://localhost:5000/get-products').then(res => res.json()),
                fetch('categories.json?t=' + Date.now()).then(res => res.json())
            ])
            .then(([products, categories]) => {
                allCategoriesForDropdown = categories;
                if (!products.length) {
                    list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">مافيش منتجات حتى الآن</p>';
                    return;
                }
                list.innerHTML = '<h3>📦 كل المنتجات (' + products.length + ')</h3>';
                products.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'prod-item';
                    const img = (p.images ? p.images[0] : p.img) || '';
                    const options = categories.map(c =>
                        `<option value="${c.id}" ${c.id === p.category ? 'selected' : ''}>${c.label}</option>`
                    ).join('');
                    item.innerHTML = `
                        <img src="${img}" />
                        <div class="info"><b>${p.name}</b>${p.price} دج</div>
                        <select id="cat-${p.id}" style="padding:4px; border-radius:6px; border:1px solid #ddd; font-size:12px;">${options}</select>
                        <button onclick="changeCategory(${p.id})">💾</button>
                        <button onclick="deleteProduct(${p.id})">🗑️ حذف</button>
                    `;
                    list.appendChild(item);
                });
            })
            .catch(() => {
                list.innerHTML = '<p style="text-align:center; color:red; padding:20px;">❌ السيرفر غير متصل</p>';
            });
        }

        function changeCategory(id) {
            const newCat = document.getElementById('cat-' + id).value;
            fetch('http://localhost:5000/update-product-category', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, category: newCat })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم تغيير الفئة ونشرها');
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }

        function deleteProduct(id) {
            if (!confirm('متأكدة تحبي تحذفي هذا المنتج؟')) return;
            fetch('http://localhost:5000/delete-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('✅ تم حذف المنتج ونشر التحديث');
                } else {
                    alert('❌ خطأ: ' + (data.error || 'مشكل غير معروف'));
                }
                renderProductsList();
            })
            .catch(() => alert('❌ السيرفر غير متصل'));
        }
    </script>
</body>
</html>
