<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - Boutique Bon Plan</title>
    <style>
        :root { --pink: #e6007e; --pink-soft: #fdeef3; --gold: #d4af37; --black: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-text-size-adjust: 100%; }
        body { background: #fff; color: var(--black); padding-bottom: 40px; }
        .header { background: linear-gradient(90deg, var(--pink), var(--gold)); color: white; padding: 16px; text-align: center; }
        .header h1 { font-size: 18px; font-weight: 800; }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .step { background: var(--pink-soft); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
        .step h3 { color: var(--pink); font-size: 14px; margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px; }
        input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #eee; font-size: 14px; background: white; }
        textarea { resize: vertical; min-height: 50px; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .img-preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        .img-preview-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; border: 2px solid var(--pink); }
        .file-btn { display: block; text-align: center; background: white; border: 2px dashed var(--pink); color: var(--pink); padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, var(--pink), var(--gold)); color: white; border: none; padding: 16px; border-radius: 40px; font-size: 16px; font-weight: 800; margin-top: 16px; cursor: pointer; }
        .success-msg { display: none; background: #d1fae5; color: #065f46; padding: 12px; border-radius: 10px; text-align: center; font-weight: 700; margin-top: 14px; }
        .success-msg.show { display: block; }
        .back-link { display: inline-block; margin: 12px 16px; color: var(--pink); text-decoration: none; font-weight: 700; }
        .products-list { margin-top: 20px; }
        .products-list h3 { color: var(--pink); margin-bottom: 10px; }
        .prod-item { display: flex; align-items: center; gap: 10px; background: white; border: 1px solid var(--pink-soft); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
        .prod-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        .prod-item .info { flex: 1; font-size: 13px; }
        .prod-item .info b { display: block; }
        .prod-item button { background: #fee2e2; color: #dc2626; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: var(--pink-soft); color: var(--black); font-weight: 700; cursor: pointer; }
        .tab-btn.active { background: var(--pink); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛠️ لوحة تحكم المتجر</h1>
    </div>
    <a href="index.html" class="back-link">→ رجوع للموقع</a>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('add')">➕ إضافة منتج</button>
            <button class="tab-btn" onclick="showTab('manage')">📦 المنتجات المزادة</button>
        </div>

        <div class="tab-content active" id="tab-add">
            <div class="step">
                <h3>1️⃣ معلومات المنتج</h3>
                <label>اسم المنتج</label>
                <input type="text" id="pname" placeholder="مثلا: فستان صيفي وردي" />

                <div class="row2">
                    <div>
                        <label>السعر (دج)</label>
                        <input type="number" id="pprice" placeholder="1500" />
                    </div>
                    <div>
                        <label>القسم</label>
                        <select id="pcat">
                            <option value="lingerie">👙 ملابس داخلية نسائية</option>
                            <option value="ensembles">🎀 أطقم نسائية</option>
                            <option value="bodysuits">✨ بودي نسائي</option>
                            <option value="robes">👗 فساتين وملابس نسائية</option>
                            <option value="sleepwear">🌙 ملابس النوم</option>
                            <option value="bridal">👰🏻‍♀️ تشكيلة العروس</option>
                            <option value="shapewear">💎 ملابس شدّ الجسم</option>
                            <option value="promotions">🔥 العروض والتخفيضات</option>
                            <option value="packs">🎁 عروض الباك</option>
                        </select>
                    </div>
                </div>

                <div class="row2">
                    <div>
                        <label>اللون</label>
                        <input type="text" id="pcolor" placeholder="مثلا: وردي" />
                    </div>
                    <div>
                        <label>الستايل</label>
                        <input type="text" id="pstyle" placeholder="مثلا: أنيق" />
                    </div>
                </div>

                <label>وصف قصير (اختياري)</label>
                <textarea id="pdesc" placeholder="👗 أناقة وتميّز..."></textarea>
            </div>

            <div class="step">
                <h3>2️⃣ صور المنتج</h3>
                <label class="file-btn" for="fileInput">📷 اختاري صور من المعرض (يمكن أكثر من وحدة)</label>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(event)" />
                <div class="img-preview-grid" id="previewGrid"></div>
            </div>

            <button class="submit-btn" onclick="saveProduct()">✅ حفظ المنتج فالموقع</button>
            <div class="success-msg" id="successMsg">✅ تمت إضافة المنتج بنجاح! رجعي للموقع باش تشوفيه</div>
        </div>

        <div class="tab-content" id="tab-manage">
            <div class="products-list" id="productsList"></div>
        </div>
    </div>

    <script>
        let selectedImages = [];

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            event.target.classList.add('active');
            if (tab === 'manage') renderProductsList();
        }

        function handleFiles(event) {
            const files = Array.from(event.target.files);
            selectedImages = [];
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = '';
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImages.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    grid.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function saveProduct() {
            const name = document.getElementById('pname').value.trim();
            const price = document.getElementById('pprice').value.trim();
            const cat = document.getElementById('pcat').value;
            const color = document.getElementById('pcolor').value.trim();
            const style = document.getElementById('pstyle').value.trim();
            const desc = document.getElementById('pdesc').value.trim();

            if (!name || !price || selectedImages.length === 0) {
                alert('عمري، خاصك تعبي على الأقل: الاسم، السعر، وصورة وحدة');
                return;
            }

            const product = {
                id: Date.now(),
                category: cat,
                brand: 'Boutique Bon Plan',
                name: name,
                price: parseInt(price),
                images: selectedImages,
                rating: 4.8,
                color: color,
                style: style
            };
            if (desc) product.description = desc;

            document.getElementById('successMsg').innerHTML = '⏳ جاري النشر...';
            document.getElementById('successMsg').classList.add('show');

            fetch('http://localhost:5000/add-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('successMsg').innerHTML = '✅ تم إضافة المنتج ونشره بنجاح!';
                } else {
                    document.getElementById('successMsg').innerHTML = '❌ خطأ: ' + (data.error || 'مشكل غير معروف');
                }
            })
            .catch(err => {
                document.getElementById('successMsg').innerHTML = '❌ السيرفر غير متصل. تأكدي أنه خدام.';
            });
            document.getElementById('pname').value = '';
            document.getElementById('pprice').value = '';
            document.getElementById('pcolor').value = '';
            document.getElementById('pstyle').value = '';
            document.getElementById('pdesc').value = '';
            document.getElementById('previewGrid').innerHTML = '';
            document.getElementById('fileInput').value = '';
            selectedImages = [];

            setTimeout(() => document.getElementById('successMsg').classList.remove('show'), 4000);
        }

        function renderProductsList() {
            const list = document.getElementById('productsList');
            const products = JSON.parse(localStorage.getItem('boutique_custom_products') || '[]');
            if (products.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">مافيش منتجات مزادة يدويا حتى الآن</p>';
                return;
            }
            list.innerHTML = '<h3>📦 المنتجات المزادة (' + products.length + ')</h3>';
            products.forEach(p => {
                const item = document.createElement('div');
                item.className = 'prod-item';
                item.innerHTML = `
                    <img src="${p.images[0]}" />
                    <div class="info"><b>${p.name}</b>${p.price} دج</div>
                    <button onclick="deleteProduct(${p.id})">🗑️ حذف</button>
                `;
                list.appendChild(item);
            });
        }

        function deleteProduct(id) {
            if (!confirm('متأكدة تحبي تحذفي هذا المنتج؟')) return;
            let products = JSON.parse(localStorage.getItem('boutique_custom_products') || '[]');
            products = products.filter(p => p.id !== id);
            localStorage.setItem('boutique_custom_products', JSON.stringify(products));
            renderProductsList();
        }
    </script>
</body>
</html>
