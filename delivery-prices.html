<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Bon Plan - أسعار التوصيل</title>
    <style>
        :root { --pink: #e6007e; --pink-soft: #fdeef3; --gold: #d4af37; --black: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { background: #fff; color: var(--black); padding-bottom: 30px; }
        .page-header { background: white; padding: 12px 16px; text-align: center; border-bottom: 2px solid var(--pink-soft); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .page-header .back { text-decoration: none; color: var(--pink); font-size: 22px; font-weight: 700; }
        .page-header h1 { font-size: 16px; font-weight: 800; color: var(--pink); flex: 1; }
        .intro { text-align: center; padding: 10px 16px; }
        .intro h2 { font-size: 16px; color: var(--pink); font-weight: 800; }
        .legend { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 6px 16px 10px; font-size: 11px; }
        .legend span { background: var(--pink-soft); padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .search-bar { padding: 0 16px 10px; }
        .search-bar input { width: 100%; padding: 10px 16px; border-radius: 30px; border: 2px solid var(--pink-soft); background: var(--pink-soft); font-size: 13px; outline: none; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: var(--pink); color: white; padding: 8px 4px; position: sticky; top: 53px; font-size: 11px; }
        td { padding: 7px 4px; text-align: center; border-bottom: 1px solid var(--pink-soft); }
        tr:nth-child(even) { background: #fffaf5; }
        .wilaya-name { text-align: right; font-weight: 700; padding-right: 10px; }
        .zero { color: #999; font-style: italic; }
        .no-results { text-align: center; padding: 30px; color: #888; }
    </style>
    <script src="apply-colors.js"></script>
</head>
<body>
    <div class="page-header">
        <a href="index.html" class="back">→</a>
        <h1>🚚 أسعار التوصيل</h1>
        <span style="width:22px"></span>
    </div>
    <div class="intro">
        <h2>التوصيل لـ 57 ولاية</h2>
    </div>
    <div class="legend">
        <span>🏢 عمود 1 = مكتب التوصيل</span>
        <span>🏠 عمود 2 = باب المنزل</span>
        <span>0 = التوصيل لهذه الولاية عبر المكتب فقط</span>
    </div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 ابحثي عن ولايتك..." onkeyup="filterTable()" />
    </div>
    <table id="priceTable">
        <thead>
            <tr><th>الولاية</th><th>🏢 مكتب</th><th>🏠 منزل</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div class="no-results" id="noResults" style="display:none;">😕 مالقيناش ولاية بهذا الاسم</div>
    <p style="text-align:center; padding: 16px; font-size:12px; color:#999;">🔄 إرجاع المنتج: 50 دج</p>
    <script>
        function loadDeliveryPrices() {
            return fetch('delivery-prices.json?t=' + Date.now())
                .then(res => res.json())
                .then(wilayas => {
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = wilayas.map(w => {
                        const officeCell = w.office === 0 ? '<td class="zero">0</td>' : `<td>${w.office}</td>`;
                        const homeCell = w.home === 0 ? '<td class="zero">0</td>' : `<td>${w.home}</td>`;
                        return `<tr><td class="wilaya-name">${w.name}</td>${officeCell}${homeCell}</tr>`;
                    }).join('');
                });
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.trim();
            const rows = document.querySelectorAll('#tableBody tr');
            let found = false;
            rows.forEach(row => {
                const name = row.querySelector('.wilaya-name').textContent;
                const match = name.includes(query);
                row.style.display = match ? '' : 'none';
                if (match) found = true;
            });
            document.getElementById('noResults').style.display = found ? 'none' : 'block';
        }

        loadDeliveryPrices();
    </script>
</body>
</html>
