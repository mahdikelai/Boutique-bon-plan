<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Bon Plan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f0ed;
            color: #2d2d2d;
            padding-bottom: 60px;
        }

        /* الهيدر */
        .header {
            background: white;
            padding: 20px 16px 12px;
            text-align: center;
            border-bottom: 2px solid #eee;
        }
        .header .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #b45a6b;
            letter-spacing: 1px;
        }
        .header .sub {
            font-size: 14px;
            color: #888;
            margin-top: 2px;
        }

        /* شريط البحث */
        .search-bar {
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .search-bar input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            border: 2px solid #ddd;
            background: #f5f0ec;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        .search-bar input:focus {
            border-color: #b45a6b;
            background: white;
        }

        /* القائمة العلوية (Menu) */
        .top-menu {
            background: white;
            border-bottom: 2px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .top-menu a {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #555;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
            padding: 4px 12px;
            border-radius: 12px;
            gap: 0px;
        }
        .top-menu a.active {
            color: #b45a6b;
        }
        .top-menu a .icon {
            font-size: 26px;
            margin-bottom: 0px;
        }
        .top-menu a span {
            font-size: 11px;
            margin-top: 0px;
        }
        .top-menu a:hover {
            color: #b45a6b;
            background: #f5f0ec;
        }
        .top-menu a .badge {
            background: #b45a6b;
            color: white;
            border-radius: 50%;
            padding: 1px 7px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 2px;
            display: none;
        }

        /* القائمة الجانبية (الأقسام) */
        .sidebar {
            background: white;
            padding: 16px 16px 10px;
            border-bottom: 1px solid #eee;
        }
        .sidebar h2 {
            font-size: 18px;
            color: #b45a6b;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .sidebar .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sidebar .categories a {
            background: #f5f0ec;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .sidebar .categories a:hover {
            background: #b45a6b;
            color: white;
            border-color: #b45a6b;
            transform: scale(1.03);
        }
        .sidebar .categories a.active {
            background: #b45a6b;
            color: white;
            border-color: #b45a6b;
        }

        /* المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-card {
            background: white;
            border-radius: 24px;
            padding: 14px 12px 18px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            transition: 0.3s;
            text-decoration: none;
            color: inherit;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.1);
        }
        .product-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 8px;
        }
        .product-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin: 6px 0 2px;
        }
        .product-card .price {
            color: #b45a6b;
            font-weight: 800;
            font-size: 19px;
        }
        .no-products {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 20px;
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            .header .logo { max-width: 110px; }
            .header h1 { font-size: 22px; }
            .sidebar .categories a { font-size: 12px; padding: 6px 14px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding: 14px; }
            .top-menu a .icon { font-size: 22px; }
            .top-menu a span { font-size: 10px; }
        }
    </style>
</head>
<body>
    <!-- الهيدر -->
    <div class="header">
        <img src="images/logo.png" alt="Boutique Bon Plan" class="logo" />
        <h1>Boutique Bon Plan</h1>
        <div class="sub">👗 أناقة • راحة • تميّز</div>
    </div>

    <!-- شريط البحث -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 ابحثي عن منتج..." onkeyup="filterProducts()" />
    </div>

    <!-- القائمة العلوية -->
    <div class="top-menu">
        <a href="#categories">
            <span class="icon">📂</span>
            <span>الأقسام</span>
        </a>
        <a href="https://wa.me/213XXXXXXXX" target="_blank">
            <span class="icon">💬</span>
            <span>واتساب</span>
        </a>
        <a href="#search">
            <span class="icon">🔍</span>
            <span>بحث</span>
        </a>
        <a href="cart.html">
            <span class="icon">🛒</span>
            <span>السلة</span>
            <span class="badge" id="cartCountTop">0</span>
        </a>
    </div>

    <!-- القائمة الجانبية (الأقسام) -->
    <div class="sidebar">
        <h2>📌 أقسامنا</h2>
        <div class="categories" id="categoriesContainer">
            <a href="?cat=all" class="active">الكل</a>
            <a href="?cat=lingerie">لانجري</a>
            <a href="?cat=pret-a-porter">أزياء</a>
            <a href="?cat=accessoires">إكسسوارات</a>
            <a href="?cat=nuisettes">نيسيت</a>
        </div>
    </div>

    <!-- المنتجات -->
    <div class="products-grid" id="productGrid"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeCategory = urlParams.get('cat') || 'all';

        document.querySelectorAll('.categories a').forEach(link => {
            link.classList.remove('active');
            const linkCat = link.getAttribute('href').split('=')[1] || 'all';
            if (linkCat === activeCategory) {
                link.classList.add('active');
            }
        });

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('boutique_cart') || '[]');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartCountTop');
            if (badge) {
                badge.textContent = count;
                badge.style.display = count > 0 ? 'inline' : 'none';
            }
        }

        fetch('products.js')
            .then(res => res.text())
            .then(data => {
                const match = data.match(/const products = (\[[\s\S]*?\]);/);
                if (!match) return;
                const allProducts = eval(match[1]);
                const grid = document.getElementById('productGrid');
                grid.innerHTML = '';

                let filtered = allProducts;
                if (activeCategory !== 'all') {
                    filtered = allProducts.filter(p => p.category === activeCategory);
                }

                if (filtered.length === 0) {
                    grid.innerHTML = '<div class="no-products">😕 لا توجد منتجات في هذا القسم حالياً</div>';
                    return;
                }

                filtered.forEach(p => {
                    const imgSrc = p.images ? p.images[0] : p.img;
                    const card = document.createElement('a');
                    card.className = 'product-card';
                    card.href = 'singleProduct.html?id=' + p.id;
                    card.innerHTML = `
                        <img src="${imgSrc}" alt="${p.name}" />
                        <h3>${p.name}</h3>
                        <div class="price">${p.price} دج</div>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('productGrid').innerHTML = '<div class="no-products">لا توجد منتجات حالياً</div>';
            });

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                const name = card.querySelector('h3').textContent.toLowerCase();
                card.style.display = name.includes(query) ? '' : 'none';
            });
        }

        updateCartCount();
    </script>
</body>
</html>
